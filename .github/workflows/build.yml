name: Quiz Vance Verify and Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'
  PYTHON_VERSION: '3.14'
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://quiz-vance-redesign-backend.fly.dev' }}

jobs:
  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject tracked or staged secrets
        run: node scripts/check_secret_hygiene.mjs

  backend:
    name: Backend tests and static security
    runs-on: ubuntu-latest
    needs: secret-hygiene
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and audit tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install pytest==8.4.1 ruff==0.12.5 bandit==1.8.6
      - name: Compile
        run: python -m compileall -q app alembic
      - name: Test
        run: python -m pytest tests -q
      - name: Ruff
        run: python -m ruff check app tests --select E9,F63,F7,F82
      - name: Bandit
        run: python -m bandit -r app -ll
      - name: Alembic single head
        run: |
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic heads

  backend-image:
    name: Backend image, SBOM and vulnerability scan
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build immutable candidate
        run: docker build --pull --tag quiz-vance-backend:${{ github.sha }} backend
      - name: Enforce CVE-2026-15308 compensating control
        run: |
          if grep -R -n -E 'html\.parser|HTMLParser|from html|import html' backend/app; then
            echo "The temporary CVE-2026-15308 exception is no longer valid."
            exit 1
          fi
      - name: Generate backend image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: quiz-vance-backend:${{ github.sha }}
          format: spdx-json
          output-file: backend-image-sbom.spdx.json
          artifact-name: backend-image-sbom
      - name: Scan backend image
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: quiz-vance-backend:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          config: .grype.yaml
          output-format: table
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom-${{ github.sha }}
          path: backend-image-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android production universal APK
    runs-on: ubuntu-latest
    needs: [secret-hygiene, backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Require production signing inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Resolve release version
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build production universal APK
        run: >-
          flutter build apk --release --flavor production --target lib/main.dart
          --no-pub
          --dart-define=BACKEND_URL=${{ env.BACKEND_URL }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}
      - name: Verify signature, alignment and release metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-production-release.apk
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > apksigner-report.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" > zipalign-report.txt
          APK_SHA256="$(sha256sum "$APK" | awk '{print toupper($1)}')"
          CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print toupper($2); exit}' apksigner-report.txt)"
          test -n "$CERT_SHA256"
          export APK_SHA256 CERT_SHA256
          node -e 'const fs=require("fs"); const manifest={schema_version:1,commit:process.env.GITHUB_SHA,app_version:process.env.APP_VERSION,artifact:"app-production-release.apk",apk_sha256:process.env.APK_SHA256,certificate_sha256:process.env.CERT_SHA256,backend_url:process.env.BACKEND_URL}; fs.writeFileSync("release-manifest.json",JSON.stringify(manifest,null,2)+"\n")'
      - name: Generate APK SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build/app/outputs/flutter-apk/app-production-release.apk
          format: spdx-json
          output-file: android-apk-sbom.spdx.json
          artifact-name: android-apk-sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quiz-vance-android-universal-${{ env.APP_VERSION }}
          path: |
            build/app/outputs/flutter-apk/app-production-release.apk
            release-manifest.json
            android-apk-sbom.spdx.json
            apksigner-report.txt
            zipalign-report.txt
          if-no-files-found: error
          retention-days: 30
