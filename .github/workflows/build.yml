name: Quiz Vance Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://quiz-vance-redesign-backend.fly.dev' }}

jobs:
  analyze:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/') && vars.ANDROID_SIGNING_CONFIGURED == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        shell: bash
        run: |
          APP_VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          EOF

      - name: Build APK
        run: flutter build apk --release --dart-define=BACKEND_URL="$BACKEND_URL" --dart-define=APP_VERSION="$APP_VERSION"

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --dart-define=BACKEND_URL="$BACKEND_URL" --dart-define=APP_VERSION="$APP_VERSION"

      - name: Build AAB
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build appbundle --release --dart-define=BACKEND_URL="$BACKEND_URL" --dart-define=APP_VERSION="$APP_VERSION"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-split
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7

      - name: Upload AAB artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk-universal
          path: artifacts/android-universal

      - name: Download Android split APKs
        uses: actions/download-artifact@v8
        with:
          name: android-apk-split
          path: artifacts/android-split

      - name: Download Android AAB
        uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: artifacts/android-aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-universal/*.apk
            artifacts/android-split/*.apk
            artifacts/android-aab/*.aab
          generate_release_notes: true
          body: |
            ## Quiz Vance ${{ github.ref_name }}

            ### Downloads
            - Android APK universal
            - Android APKs split por ABI
            - Android AAB release

            ### Configuracao
            Defina a variavel `BACKEND_URL` no repositorio para apontar para seu backend Python/FastAPI.
