app = "quiz-vance-redesign-backend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  DOCUMENT_WORKER_ENABLED = "1"
  PORT = "8080"
  STUDY_DOCUMENT_STORAGE_ROOT = "/data/study_documents"
  WEB_CONCURRENCY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health/ready"
