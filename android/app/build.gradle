plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def requiredSigningProperties = [
    "storeFile",
    "storePassword",
    "keyAlias",
    "keyPassword",
]
def missingSigningProperties = requiredSigningProperties.findAll {
    !keystoreProperties[it]?.trim()
}
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
def releaseStoreFile = keystoreProperties["storeFile"] ?
    rootProject.file(keystoreProperties["storeFile"]) : null
def hasReleaseSigning = keystorePropertiesFile.exists() &&
    missingSigningProperties.isEmpty() &&
    releaseStoreFile?.exists()

if (releaseBuildRequested && !hasReleaseSigning) {
    def reason = !keystorePropertiesFile.exists() ?
        "android/key.properties is missing" :
        missingSigningProperties ?
            "missing properties: ${missingSigningProperties.join(', ')}" :
            "keystore file does not exist: ${releaseStoreFile}"
    throw new GradleException(
        "Release signing credentials are required; ${reason}."
    )
}

android {
    namespace "com.quizvance.quiz_vance_flutter"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId "com.quizvance.quiz_vance_flutter"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        multiDexEnabled true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libsqlite3.so']
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile releaseStoreFile
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
